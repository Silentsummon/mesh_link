name: mesh_chat
description: An anonymous, offline, end-to-end encrypted mesh chat app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Bluetooth ---
  flutter_blue_plus: ^1.32.12
  flutter_ble_peripheral: ^1.2.6

  # --- Cryptography ---
  cryptography: ^2.7.0
 # cryptography_flutter: 2.3.2
  flutter_secure_storage: ^8.0.0

  # --- Storage ---
  sqflite: ^2.3.3+1
  hive_flutter: ^1.1.0
  path: ^1.9.0

  # --- State Management & Navigation ---
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # --- Utilities ---
  uuid: ^3.0.7
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true